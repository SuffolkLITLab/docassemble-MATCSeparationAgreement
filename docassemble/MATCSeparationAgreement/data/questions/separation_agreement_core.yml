  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }
progress: 100
---
#################### Review screen #####################

id: review a divorce agreement
event: review_a_divorce_agreement
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Parties**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: users[0].has_attorney
    button: |
      **${ users[0].familiar() }'s lawyer**: ${ users[0].sa_attorney_name if users[0].has_attorney else "None" }
  - Edit: users[1].has_attorney
    button: |
      **${ users[1].familiar() }'s lawyer**: ${ users[1].sa_attorney_name if users[1].has_attorney else "None" }
  - Edit: has_children
    button: |
      **Children of the marriage**: ${ word(yesno(has_children)) }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor
    show if: has_children
  - Edit: custody_type_choice
    button: |
      **Custody arrangement**: ${ custody_type_choice }
    show if: has_children
  - Edit: parenting_time_description
    button: |
      **Parenting time schedule**: ${ parenting_time_description }

      **If you can't agree**: ${ parenting_time_fallback }
    show if: has_children
  - Edit: sa_holiday_plan
    button: |
      ${ sa_holiday_text }

      ${ sa_vacation_text }
    show if: has_children
  - Edit: parenting_communication_methods
    button: |
      **How you will communicate**: ${ sa_communication_list or "Not agreed" }
    show if: has_children
  - Edit: child_support_payer
    button: |
      **Child support payer**: ${ child_support_payer }
    show if: has_children
  - Edit: child_support_guideline_amount
    button: |
      **Guideline child support amount**: ${ currency(child_support_guideline_amount) }
    show if: has_children
  - Edit: child_support_deviation
    button: |
      **Deviation from guidelines**: ${ word(yesno(child_support_deviation)) }
    show if: has_children
  - Edit: health_insurance_provided_for_children
    button: |
      **Health insurance for children**: ${ word(yesno(health_insurance_provided_for_children)) }
    show if: has_children
  - Edit: education_cost_terms
    button: |
      **College or trade school costs**: ${ education_cost_terms_label }
    show if: has_children
  - Edit: child_tax_claim_single_party
    button: |
      **Same parent claims children on taxes every year**: ${ word(yesno(child_tax_claim_single_party)) }
    show if: has_children
  - Edit: health_insurance_self_responsible
    button: |
      **Each spouse keeps their own health insurance**: ${ word(yesno(health_insurance_self_responsible)) }
  - Edit: taxes_custom_terms
    button: |
      **Agreement on taxes**: ${ word(yesno(taxes_custom_terms)) }
  - Edit: alimony_waived_all
    button: |
      **Alimony waived**: ${ word(yesno(alimony_waived_all)) }
  - Edit: alimony_end_date
    button: |
      **Alimony end date**: ${ alimony_end_date if alimony_end_date else "None" }.
      **Can end with cohabitation**: ${ word(yesno(alimony_ends_on_cohabitation)) }
    show if: not alimony_waived_all and alimony_payment_agreed
  - Edit: sa_properties.revisit
    button: |
      **Real estate**: ${ comma_and_list([prop.address for prop in sa_properties]) if not no_real_estate else "None" }
  - Edit: sa_vehicles.revisit
    button: |
      **Vehicles**: ${ comma_and_list([v.description for v in sa_vehicles]) if sa_have_vehicles else "None" }
  - Edit: sa_equalization_agreed
    button: |
      **Balancing payment**: ${ sa_equalization_text or "None" }
  - Edit: personal_property_already_divided
    button: |
      **Personal property already divided**: ${ word(yesno(personal_property_already_divided)) }
      % if personal_property_removal_days:
      **Remove the other's property within**: ${ personal_property_removal_days } days
      % endif
      % if personal_property_title_days:
      **Transfer titles within**: ${ personal_property_title_days } days
      % endif
  - Edit: no_marital_debt
    button: |
      **Have shared marital debt**: ${ word(yesno(not no_marital_debt)) }
  - Edit: no_retirement_benefits
    button: |
      **Have retirement or pension benefits**: ${ word(yesno(not no_retirement_benefits)) }
  - Edit: no_life_insurance
    button: |
      **No life insurance**: ${ word(yesno(no_life_insurance)) }
  - Edit: provisions_that_merge
    button: |
      **Provisions that merge**: ${ provisions_that_merge.true_values() }
  - Edit: dispute_resolution_clause
    button: |
      **Settle disagreements before going to court**: ${ word(yesno(dispute_resolution_clause)) }
  - Edit: trial_court
    button: |
      **Court**: ${ trial_court if defined('trial_court') else '' }
  - Edit: docket_number
    button: |
      **Docket number**: ${ docket_number }
---
