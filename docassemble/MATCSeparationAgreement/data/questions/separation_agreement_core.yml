    datatype: currency
    min: 0
    show if: users1_life_insurance_required
  - How much coverage will ${ users[1].familiar() } keep?: users2_life_insurance_amount
    datatype: currency
    min: 0
    show if: users2_life_insurance_required
---
code: |
  # How long each party keeps the policy: while that party pays child support
  # or alimony under the agreement; a party who pays neither keeps it until
  # the youngest child is emancipated.
  sa_life_insurance_terms = []
  for person in users:
    obligations = []
    if has_children and sa_support_children and child_support_payer == person.name.full():
      obligations.append("child support")
    if not alimony_waived_all and alimony_payment_agreed and alimony_payer == person.name.full():
      obligations.append("alimony")
    if obligations:
      sa_life_insurance_terms.append("for so long as " + person.name.full() + " has an obligation to pay " + " or ".join(obligations) + " under this Agreement")
    else:
      sa_life_insurance_terms.append("until the youngest child of the parties is emancipated, as defined in this Agreement")
  sa_life_insurance_term_a = sa_life_insurance_terms[0]
  sa_life_insurance_term_b = sa_life_insurance_terms[1]
  del person
