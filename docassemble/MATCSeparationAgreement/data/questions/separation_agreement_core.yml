content: |
  * **This agreement binds both of you.** It is a contract. When you both sign
    it, you each agree to do what it says.
  * **The judge reviews it at your hearing.** If the judge approves it, it
    becomes part of your divorce judgment.
  * **Some terms can change later, and some usually cannot.** If things change,
    the court can change ${ "the terms about your children and " if has_children else "" }any
    terms you chose to merge. Terms that survive as a contract, and the way you divide your
    property, usually cannot be changed.
  * **Each of you may want a lawyer to read it before you sign.**
