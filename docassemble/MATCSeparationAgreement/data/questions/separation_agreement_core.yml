---
#################### Interview order #####################

id: interview_order_a_divorce_agreement
code: |
  nav.set_section("parties")
  users[0].name.first
  users[0].phone_number
  party_a_handoff
  users[1].name.first
  users[1].phone_number
  users[0].has_attorney
  if users[0].has_attorney:
    users[0].sa_attorney_name
    users[0].sa_attorney_address
  users[1].has_attorney
  if users[1].has_attorney:
    users[1].sa_attorney_name
    users[1].sa_attorney_address

  # Set roles — Party A is users[0], Party B is users[1]
  users[0].party_label = "Party A"
  users[1].party_label = "Party B"
  users[0].separation_agreement_role = "party_a"
  users[1].separation_agreement_role = "party_b"
  party_a = users[0]
  party_b = users[1]

  nav.set_section("children_overview")
  has_children

  if has_children:
    children.target_number
    children.gather()

    nav.set_section("child_custody")
    custody_type_choice

    nav.set_section("parenting_time")
    parenting_schedule_pattern
    parenting_time_description
    parenting_time_fallback
    sa_holiday_plan
    parenting_time_attached_schedule
    # Asked after the schedule so the examples can build on it.
    custody_custom_description
    parenting_communication_methods

    nav.set_section("child_support")
    sa_support_children_reviewed
    if not sa_support_children:
      sa_no_support_children_notice
  if has_children and sa_support_children:
    child_support_payer
    child_support_recipient
    child_support_wage_assignment
    if child_support_wage_assignment:
      child_support_wage_assignment_full
      if not child_support_wage_assignment_full:
        child_support_shortfall_payer
    else:
      child_support_direct_payment
    child_support_guideline_amount
    child_support_deviation
    if child_support_deviation:
      child_support_deviation_reason
      child_support_amount_value
    child_support_frequency
    if len(sa_support_children) > 1:
      child_support_applies_to
    child_support_ends_at_21
    if not child_support_ends_at_21:
      child_support_end_event
      if child_support_end_event == "other":
        child_support_end_other

  if has_children:
    nav.set_section("child_health_insurance")
    health_insurance_provided_for_children
    if not health_insurance_provided_for_children:
      health_insurance_custom_details_children
    else:
      health_insurance_provider_children
      health_insurance_types_children
      health_insurance_until
      uninsured_expenses_split_children
      health_insurance_custom_description_children

    nav.set_section("education")
    education_cost_terms
    education_custom_description
    extracurricular_custom_terms
    if extracurricular_custom_terms:
      extracurricular_description

    nav.set_section("child_tax")
    child_tax_claim_single_party
    if child_tax_claim_single_party:
      child_tax_single_party
    else:
      child_tax_claim_split_years
      if child_tax_claim_split_years:
        child_tax_odd_year_party
        child_tax_even_year_party
    child_tax_claim_custom_description

    nav.set_section("life_insurance")
    users1_life_insurance_required
    users2_life_insurance_required
    neither_party_life_insurance
    if users1_life_insurance_required:
      users1_life_insurance_amount
    if users2_life_insurance_required:
      users2_life_insurance_amount

  nav.set_section("adult_health_insurance")
  # Ask who covers whom first. Spouses who each keep their own insurance
  # already agree, so only ask about an agreement when one covers the other.
  health_insurance_self_responsible
  health_insurance_custom_terms_adult
  if not health_insurance_custom_terms_adult:
    health_insurance_no_agreement_exit
  if not health_insurance_self_responsible:
    health_insurance_provider_adult
    health_insurance_types_adult
    health_insurance_with_cost_allowed
    if health_insurance_with_cost_allowed == "Yes":
      health_insurance_cost_payer_adult
  uninsured_expenses_self_responsible
  health_insurance_custom_description_adult

  nav.set_section("taxes")
  taxes_custom_terms
  if not taxes_custom_terms:
    taxes_no_agreement_exit
  taxes_file_separately

  nav.set_section("alimony")
  alimony_waived_all
  if not alimony_waived_all:
    alimony_payment_agreed
    if alimony_payment_agreed:
      alimony_payer
      alimony_recipient
      alimony_amount_value
      alimony_frequency
      if alimony_frequency != "Other":
        alimony_due_on
      alimony_end_date
      alimony_custom_description
      if has_children and sa_support_children:
        alimony_child_support_caution
    else:
      alimony_no_agreement_exit

  nav.set_section("real_estate")
  no_real_estate
  sa_properties.gather()

  nav.set_section("personal_property")
  sa_vehicles.gather()
  personal_property_already_divided
  sa_equalization_text

  nav.set_section("debts")
  no_marital_debt
  if not no_marital_debt:
    debt_custom_terms
    debt_custom_description
  individual_debt_responsible_each
  if not individual_debt_responsible_each:
    users[0].debt_listed
    users[1].debt_listed

  nav.set_section("retirement")
  no_retirement_benefits

  nav.set_section("life_insurance")
  no_life_insurance

  nav.set_section("merger")
  provisions_that_merge
  dispute_resolution_clause

  nav.set_section("court_info")
  trial_court
  docket_number

  # The agreement template reads these, but no question asks for them. The
  # attachment uses skip undefined, so anything left undefined here prints
  # blank instead of raising an error. Compute them before the document.
  has_no_children
  agreement_merge_partial
  merge_alimony
  merge_child_issues
  merge_other_description
  if has_children:
    custody_sole
    parenting_time_assigned
    education_cost_based_on_ability
    sa_communication_list
    sa_holiday_text
  if has_children and sa_support_children:
    sa_child_support_amount
  if not alimony_waived_all and alimony_payment_agreed:
    sa_alimony_period
  if has_children and (users1_life_insurance_required or users2_life_insurance_required):
    sa_life_insurance_term_a

  interview_order_a_divorce_agreement = True
---
#################### Derived variables #####################

code: |
  merge_alimony = provisions_that_merge["Alimony"]
  merge_health_insurance = provisions_that_merge["Health insurance (adult)"]
  merge_life_insurance = provisions_that_merge["Life insurance"]
---
code: |
  # Property division always survives. Child-related terms always merge
  # (G.L. c. 208, § 28), and the parties pick which other terms merge, so the
  # agreement is either partly merged or survives as a whole.
  agreement_merge_fully = False
  agreement_merge_partial = has_children or not provisions_that_merge.all_false()
  agreement_merge_none = not agreement_merge_partial
---
code: |
  merge_child_issues = has_children
---
code: |
  # The due day follows the schedule, as it does for child support: weekly and
  # biweekly payments are due on Friday, monthly ones on the first. An "Other"
  # schedule states its own timing, so the order block never asks for this.
  if alimony_frequency in ("Weekly", "Biweekly"):
    alimony_due_on = "friday"
  else:
    alimony_due_on = "first_of_month"
---
code: |
  if alimony_frequency == "Weekly":
    sa_alimony_period = "per week"
  elif alimony_frequency == "Biweekly":
    sa_alimony_period = "every two weeks"
  elif alimony_frequency == "Monthly":
    sa_alimony_period = "per month"
  else:
    sa_alimony_period = alimony_frequency_other
---
code: |
  # The amount the agreement states: the Guidelines amount unless the parties
  # chose to deviate, in which case the amount they agreed on.
  if child_support_deviation:
    sa_child_support_amount = child_support_amount_value
  else:
    sa_child_support_amount = child_support_guideline_amount
  if child_support_frequency == "Weekly":
    sa_child_support_period = "week"
  elif child_support_frequency == "Monthly":
    sa_child_support_period = "month"
  else:
    sa_child_support_period = child_support_frequency_other
---
code: |
  # The template's "Other" line in the partial-merger list. Nothing collects
  # free-text merge terms yet.
  merge_other_description = ""
---
code: |
  custody_joint_legal_physical = (custody_type_choice == "Joint legal and physical custody")
  custody_joint_legal_split_physical = (custody_type_choice == "Joint legal custody, but one parent has primary physical custody")
  custody_sole = (custody_type_choice == "Sole legal and physical custody")
---
code: |
  signature_fields = ['users[0].signature', 'users[1].signature']
---
code: |
  has_no_children = not has_children
---
#################### Party info #####################

id: party A name
sets:
  - users[0].name.first
  - users[0].name.last
question: |
  First spouse's name
subquestion: |
  Enter one spouse's legal name as it appears on court paperwork. You will
  enter the other spouse's name next.

  If you have two middle names or two last names, enter both in the same
  box, the way they appear on your marriage certificate.
fields:
  - First name: users[0].name.first
  - Middle name: users[0].name.middle
    required: False
  - Last name: users[0].name.last
  - Suffix: users[0].name.suffix
    required: False
    choices:
      - Jr.
      - Sr.
      - II
      - III
      - IV
---
id: party A phone
question: |
  ${ users[0].familiar() }'s phone number
fields:
  - Phone number: users[0].phone_number
---
id: party A handoff
continue button field: party_a_handoff
question: |
  Thank you, ${ users[0].familiar() }.
subquestion: |
  Next, we will collect the second spouse's contact information.
---
id: party B name
sets:
  - users[1].name.first
  - users[1].name.last
question: |
  Second spouse's name
subquestion: |
  Enter the other spouse's legal name as it appears on court paperwork.

  If you have two middle names or two last names, enter both in the same
  box, the way they appear on your marriage certificate.
fields:
  - First name: users[1].name.first
  - Middle name: users[1].name.middle
    required: False
  - Last name: users[1].name.last
  - Suffix: users[1].name.suffix
    required: False
    choices:
      - Jr.
      - Sr.
      - II
      - III
      - IV
---
id: party B phone
question: |
  ${ users[1].familiar() }'s phone number
fields:
  - Phone number: users[1].phone_number
---
id: separation agreement counsel
question: |
  Does ${ users[i].familiar() } have a lawyer?
subquestion: |
  The agreement says whether each of you has a lawyer, and gives the lawyer's
  name and address. Only the two of you sign it.
fields:
  - Does ${ users[i].familiar() } have a lawyer?: users[i].has_attorney
    datatype: yesnoradio
  - Lawyer's full name: users[i].sa_attorney_name
    show if:
      variable: users[i].has_attorney
      is: True
  - Lawyer's mailing address: users[i].sa_attorney_address
    show if:
      variable: users[i].has_attorney
      is: True
---
#################### Children #####################

id: has children
question: |
  Children
subquestion: |
  The court can order support for a child under 18. It can also order support
  for a child age 18 to 20 who lives with a parent and depends mainly on that
  parent, and for a child age 21 or 22 who depends on that parent because the
  child is enrolled in an educational program, up to an undergraduate degree
  ([G.L. c. 208, § 28](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section28)).

  [Learn more about child support in Massachusetts](https://www.mass.gov/info-details/child-support-guidelines)
fields:
  - Do you have any unemancipated children together?: has_children
    datatype: yesnoradio
---
id: how many children
question: |
  How many children do you have together?
subquestion: |
  Include any unemancipated children from this marriage: children under 18,
  children 18 to 20 who still live with and depend on a parent, and children
  21 or 22 who depend on a parent because they are still in school.
fields:
  - Number of children: children.target_number
    datatype: integer
    min: 1
---
id: child info
sets:
  - children[i].name.first
  - children[i].birthdate
question: |
  ${ ordinal(i).capitalize() } child's information
fields:
  - First name: children[i].name.first
  - Middle name: children[i].name.middle
    required: False
  - Last name: children[i].name.last
  - Date of birth: children[i].birthdate
    datatype: date
---
#################### Child Custody #####################

template: custody_term_joint_legal_physical
subject: |
  Joint legal and physical custody
content: |
  Both parents share responsibility for major decisions about the child —
  including education, medical care, and religious upbringing — and the
  child lives equally in both homes.
---
template: custody_term_joint_legal_split_physical
subject: |
  Joint legal custody, but one parent has primary physical custody
content: |
  Both parents share major decisions about the child, but the child lives
  primarily with one parent. The other parent has parenting time as agreed.
---
template: custody_term_sole
subject: |
  Sole legal and physical custody
content: |
  One parent has the right and responsibility to make all major decisions
  about the child, and the child lives primarily with that parent. The
  other parent may have parenting time.
---
id: child custody
question: |
  Custody arrangement
subquestion: |
  ${ collapse_template(custody_term_joint_legal_physical) }

  ${ collapse_template(custody_term_joint_legal_split_physical) }

  ${ collapse_template(custody_term_sole) }

  [Learn more about custody arrangements](https://www.mass.gov/info-details/learn-about-the-types-of-child-custody-arrangements)
fields:
  - What is your custody arrangement?: custody_type_choice
    datatype: radio
    choices:
      - Joint legal and physical custody
      - Joint legal custody, but one parent has primary physical custody
      - Sole legal and physical custody
  - Who will have custody?: sole_custody_holder
    input type: dropdown
    choices:
      - ${ users[0].name.full() }
      - ${ users[1].name.full() }
    show if:
      variable: custody_type_choice
      is: "Sole legal and physical custody"
  - Who will have physical custody?: physical_custody_holder
    input type: dropdown
    choices:
      - ${ users[0].name.full() }
      - ${ users[1].name.full() }
    show if:
      variable: custody_type_choice
      is: "Joint legal custody, but one parent has primary physical custody"
---
id: custody additional terms
question: |
  Other custody and parenting terms
subquestion: |
  Is there anything else you have agreed about custody or parenting time?
  Leave this blank if not.

  For example:

  * How much notice one parent gives before taking the children out of state
  * How you will share information about school and medical care
  * How and when the children can call or video chat with the other parent
  * What happens if one parent plans to move
fields:
  - Other custody and parenting terms: custody_custom_description
    datatype: area
    required: False
---
#################### Parenting Time #####################

id: parenting schedule pattern
question: |
  Your regular parenting schedule
subquestion: |
  Pick the pattern closest to what you agreed. On the next screen you'll see
  it written out with your names, and you can change any of it.
fields:
  - no label: parenting_schedule_pattern
    datatype: radio
    choices:
      - "Week on, week off: the children alternate full weeks with each parent": week
      - "2-2-3: two days with one parent, two with the other, then three, switching each week": "223"
      - "2-2-5-5: two days with each parent, then five days with each": "2255"
      - "3-4-4-3: three days with one parent and four with the other, then the reverse": "3443"
      - "Every other weekend plus a midweek visit: the children live mainly with one parent": eow
      - "A schedule for a baby or toddler: shorter, more frequent time with the other parent": young
      - "A flexible schedule for teenagers, built around school, work, and activities": teen
      - "Something else: I'll describe it": other
---
code: |
  _a = users[0].familiar()
  _b = users[1].familiar()
  parenting_pattern_text = {
    "week": f"The children alternate weeks between {_a} and {_b}. Each week starts on Friday at 5 p.m., when the children go to the other parent.",
    "223": f"In the first week, the children are with {_a} on Monday and Tuesday, with {_b} on Wednesday and Thursday, and with {_a} from Friday through Sunday. In the second week, the parents switch days. The pattern then repeats. Exchanges happen at 5 p.m., or at school when school is in session.",
    "2255": f"The children are with {_a} every Monday and Tuesday and with {_b} every Wednesday and Thursday. Weekends from Friday through Sunday alternate between the parents. Exchanges happen at 5 p.m., or at school when school is in session.",
    "3443": f"In the first week, the children are with {_a} from Sunday at 5 p.m. to Wednesday at 5 p.m. and with {_b} from Wednesday at 5 p.m. to Sunday at 5 p.m. In the second week, the parents switch. The pattern then repeats.",
    "eow": f"The children live with {_a}. {_b} has them every other weekend from Friday at 5 p.m. to Sunday at 5 p.m., and every Wednesday from 3 p.m. to 7 p.m.",
    "young": f"The child lives with {_a}. {_b} has the child three times a week for three hours, on Tuesday, Thursday, and Saturday from 9 a.m. to 12 p.m. The parents will add time, including overnights, as the child grows.",
    "teen": f"The children live with {_a} during the school week and spend every other weekend, from Friday at 5 p.m. to Sunday at 5 p.m., with {_b}. The parents will adjust the schedule with the children's input to fit school, work, and activities.",
    "other": "",
  }[parenting_schedule_pattern]
---
id: parenting time
question: |
  Parenting time
subquestion: |
  Your agreement needs a specific parenting time plan: when the children are
  with each parent. You can agree to work out the details together, but you
  also need a set schedule that applies whenever you can't agree.

  [Learn more about parenting time](https://www.mass.gov/child-custody-and-parenting-time)
fields:
  - What is your parenting time schedule?: parenting_time_description
    datatype: area
    default: ${ parenting_pattern_text }
    help: |
      Say who has the children and when. For example: "The children live
      with ${ users[0].familiar() }. ${ users[1].familiar() } has them every
      other weekend from Friday at 5 p.m. to Sunday at 5 p.m., and every
      Wednesday from 3 p.m. to 7 p.m."

      You can also write: "The parents will work together to decide parenting
      time." If you do, the next answer must give a set schedule.
  - If you can't agree on parenting time, what schedule applies?: parenting_time_fallback
    datatype: area
    help: |
      This has to be a set schedule, with days and times. For example: "If
      the parents cannot agree, ${ users[1].familiar() } will have the children
      every other weekend from Friday at 5 p.m. to Sunday at 5 p.m."
validation code: |
  if len(parenting_time_fallback.split()) < 8:
    validation_error("Give a set schedule with days and times, for example which weekends and what hours.", field="parenting_time_fallback")
---
id: holidays and vacations
question: |
  Holidays and school vacations
subquestion: |
  Holidays and school vacations usually replace the regular schedule. Say how
  you will share them.
fields:
  - Holidays: sa_holiday_plan
    datatype: radio
    choices:
      - We will alternate holidays from year to year: alternate
      - We will split each holiday, so each parent has part of the day: split
      - Each parent will have the same holidays every year: fixed
      - The regular schedule applies on holidays: regular
      - We will attach our own holiday schedule: attach
      - Something else: other
  - Which holidays, and who has each one?: sa_holiday_details
    datatype: area
    required: False
    help: |
      For example: "Thanksgiving and Christmas Eve with ${ users[0].familiar() }
      in even-numbered years and with ${ users[1].familiar() } in odd-numbered
      years. Mother's Day with the mother and Father's Day with the father."
      Required if you chose "Each parent will have the same holidays every
      year" or "Something else".
  - School vacations: sa_vacation_plan
    datatype: radio
    choices:
      - We will alternate school vacations from year to year: alternate
      - We will split each school vacation in half: split
      - The regular schedule applies during school vacations: regular
      - Something else: other
  - Describe the school vacation plan: sa_vacation_details
    datatype: area
    required: False
    help: |
      For example, who has the children during the February and April
      vacations and for how many weeks each summer. Required if you chose
      "Something else".
validation code: |
  if sa_holiday_plan in ("fixed", "other") and not (sa_holiday_details or "").strip():
    validation_error("Say which holidays each parent has.", field="sa_holiday_details")
  if sa_vacation_plan == "other" and not (sa_vacation_details or "").strip():
    validation_error("Describe the school vacation plan.", field="sa_vacation_details")
---
code: |
  parenting_time_attached_schedule = "Yes" if sa_holiday_plan == "attach" else "No"
  _holiday = {
    "alternate": "The parties will alternate holidays from year to year.",
    "split": "The parties will split each holiday, so that each parent has the children for part of the day.",
    "fixed": "Each parent will have the same holidays every year, as follows:",
    "regular": "The regular parenting schedule applies on holidays.",
    "attach": "The parties' holiday schedule is attached.",
    "other": "The parties agree to the following holiday schedule:",
  }[sa_holiday_plan]
  if (sa_holiday_details or "").strip():
    _holiday += " " + sa_holiday_details.strip()
  _vacation = {
    "alternate": "The parties will alternate school vacations from year to year.",
    "split": "The parties will split each school vacation in half.",
    "regular": "The regular parenting schedule applies during school vacations.",
    "other": "The parties agree to the following school vacation schedule:",
  }[sa_vacation_plan]
  if (sa_vacation_details or "").strip():
    _vacation += " " + sa_vacation_details.strip()
  sa_holiday_text = "Holidays: " + _holiday
  sa_vacation_text = "School vacations: " + _vacation
---
code: |
  # Every agreement now includes a parenting time plan.
  parenting_time_assigned = True
---
id: parenting communication
question: |
  How you will talk about the children
subquestion: |
  Agreeing on how you will reach each other about the children, such as
  schedule changes, school, and health, can prevent misunderstandings.
  Choose every way you agree to use.
fields:
  - How will you communicate with each other about the children?: parenting_communication_methods
    datatype: checkboxes
    choices:
      - Phone calls: phone
      - Text messages: text
      - Email: email
      - A co-parenting app: app
      - In person: in_person
    none of the above: We haven't agreed on this
---
code: |
  sa_communication_labels = {
    "phone": "phone calls",
    "text": "text messages",
    "email": "email",
    "app": "a co-parenting app",
    "in_person": "in person",
  }
  sa_communication_list = comma_and_list([sa_communication_labels[k] for k in parenting_communication_methods.true_values()])
