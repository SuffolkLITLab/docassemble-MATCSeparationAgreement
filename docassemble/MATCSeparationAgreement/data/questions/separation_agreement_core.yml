  If your divorce is not final by December 31, you are still married for
  that tax year and file either jointly or as married filing separately. In a
  1A divorce, the judgment (called a judgment nisi) enters 30 days after the
  judge approves your agreement, and the divorce becomes final 90 days after
  that
  ([G.L. c. 208, § 21](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section21)).
  Once it is final, you file as single, or as head of household if you
  qualify ([IRS Publication 504](https://www.irs.gov/publications/p504)).

