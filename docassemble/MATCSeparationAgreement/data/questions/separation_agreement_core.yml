id: dispute resolution
question: |
  If you disagree later
subquestion: |
  After the divorce, you may disagree about what the agreement means or about
  changing it. You can agree now to try to settle a disagreement yourselves,
  and then with a mediator, before either of you goes to court.

  A **mediator** is a neutral person who helps you talk and reach your own
  agreement. A mediator does not decide for you.

  This clause is optional. It never stops either of you from going to court in
  an emergency or when someone's safety is at risk.
  % if has_children:
  The court can still change the terms about your children.
  % endif
fields:
  - Add a clause about settling disagreements before going to court?: dispute_resolution_clause
    datatype: yesnoradio
    default: False
  - How many hours of mediation, at least?: dispute_mediation_hours
    datatype: integer
    min: 1
    default: 2
    show if: dispute_resolution_clause
  - Who pays the mediator?: dispute_mediation_cost
    datatype: radio
    choices:
      - We split the cost equally: equal
      - ${ users[0] } pays: party_a
      - ${ users[1] } pays: party_b
    default: equal
    show if: dispute_resolution_clause
