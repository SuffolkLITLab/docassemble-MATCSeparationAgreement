code: |
  # Ask in a fixed order, then build the agreement's paragraph.
  sa_properties[i].address
  sa_properties[i].loan_types
  sa_properties[i].plan
  if sa_properties[i].plan == "keep":
    sa_properties[i].keeper
  elif sa_properties[i].plan == "sell":
    sa_properties[i].list_by
  elif sa_properties[i].plan == "together":
    sa_properties[i].own_share_a
  else:
    sa_properties[i].other_description
  sa_properties[i].custom_description
  # Build the agreement's paragraph here, so editing the property rebuilds it.
  _a = users[0].name.full()
  _b = users[1].name.full()
  _prop = sa_properties[i]
  _loans = {"first": "a first mortgage", "second": "a second mortgage", "heloc": "a home equity loan or line of credit"}
  _loan_list = [_loans[k] for k in _prop.loan_types.true_values()]
  _text = (
    f"The real estate located at {_prop.address} currently stands in the name of {_prop.deed_names}, "
    f"as recorded with the {_prop.county} County Registry of Deeds, Book {_prop.book}, Page {_prop.page}."
  )
  if _loan_list:
    _text += f" It is subject to {comma_and_list(_loan_list)}."
  _payer_phrase = {"a": f"{_a} will pay", "b": f"{_b} will pay", "both": "the parties will equally share the cost of"}
  if _prop.plan == "keep":
    _other = _b if _prop.keeper == _a else _a
    _text += (
      f" {_prop.keeper} will be the sole owner of the property. {_other} waives all past, present and future "
      f"interest in it and will sign a deed transferring that interest to {_prop.keeper}"
      + (f" by {_prop.deed_by}" if _prop.deed_by else "") + "."
    )
    if _loan_list:
      _text += (
        f" {_prop.keeper} will refinance or otherwise remove {_other} from all loans on the property"
        + (f" by {_prop.refinance_by}" if _prop.refinance_by else "") + "."
      )
    _text += (
      f" {_prop.keeper} will be responsible for all costs and expenses of the property, including the mortgage, "
      f"taxes, and insurance, beginning on {_prop.costs_from}."
    )
    if _prop.buyout_amount:
      _text += (
        f" {_prop.keeper} will pay {_other} {currency(_prop.buyout_amount)} for {_other}'s interest in the property"
        + (f" by {_prop.buyout_by}" if _prop.buyout_by else "") + "."
      )
  elif _prop.plan == "sell":
    _text += (
      f" The parties will list the property for sale by {_prop.list_by} and sell it. Until it is sold, "
      f"{_payer_phrase[_prop.sale_costs_payer]} the mortgage, taxes, insurance, and other costs of the property. "
      f"After the costs of sale and any loans on the property are paid, {_a} will receive {_prop.sale_share_a}% and "
      f"{_b} will receive {100 - _prop.sale_share_a}% of the proceeds."
    )
  elif _prop.plan == "together":
    _text += (
      f" The parties will continue to own the property together, with {_a} holding a {_prop.own_share_a}% share and "
      f"{_b} a {100 - _prop.own_share_a}% share. {_payer_phrase[_prop.own_costs_payer][0].upper() + _payer_phrase[_prop.own_costs_payer][1:]} the mortgage, taxes, and insurance. "
      f"The property will be sold {_prop.sale_when}, and after the costs of sale and any loans on the property are "
      f"paid, the proceeds will be divided in the same shares."
    )
  else:
    _text += f" The parties agree that: {_prop.other_description}"
  if _prop.custom_description and _prop.custom_description.strip():
    _text += f" The parties further agree that: {_prop.custom_description.strip()}"
  sa_properties[i].agreement_text = _text
  sa_properties[i].complete = True
