subquestion: |
  ${ children[i].familiar() } is ${ children[i].age_in_years() }. Child support
  for a child this age continues only in the situation below
  ([G.L. c. 208, § 28](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section28)).
fields:
  - ${ "Does " + children[i].familiar() + " live with one of you and depend mainly on that parent for support?" if children[i].age_in_years() < 21 else "Does " + children[i].familiar() + " live with one of you and depend mainly on that parent because " + children[i].familiar() + " is in college or another educational program, up to an undergraduate degree?" }: children[i].sa_support_continues
    datatype: yesnoradio
---
id: no children eligible for child support
continue button field: sa_no_support_children_notice
question: |
  No child support section
subquestion: |
  Based on your answers, none of your children can get child support under
  [G.L. c. 208, § 28](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section28):
  support ends at 18, or at 21 or 23 in the situations the law describes.

