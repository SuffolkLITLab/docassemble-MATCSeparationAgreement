#################### Child Support #####################

code: |
  # G.L. c. 208, § 28: support for a child under 18; from 18 to 21 if the
  # child is domiciled in a parent's home and principally dependent on that
  # parent; from 21 to 23 only if that dependence is due to enrollment in an
  # educational program, up to an undergraduate degree.
  def sa_child_support_eligible(child):
    age = child.age_in_years()
    if age < 18:
      return True
    if age >= 23:
      return False
    return child.sa_support_continues
---
code: |
  sa_support_children = [child for child in children if sa_child_support_eligible(child)]
  sa_no_support_children = [child for child in children if child not in sa_support_children]
  sa_support_children_reviewed = True
---
id: child support eligibility
question: |
