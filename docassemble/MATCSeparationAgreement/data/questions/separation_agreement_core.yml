    help: |
      Massachusetts law allows this for general term alimony when the person
      receiving it shares a home with someone else for at least three
      continuous months ([G.L. c. 208, § 49(d)](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section49)).
